name: Update BUFKIT data and deploy

on:
  schedule:
    - cron: "20,50 * * *"   # hourly at :20 UTC; edit to taste
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p site
          cp index.html site/
      - name: Download latest BUFKIT files
        run: python3 scripts/fetch_bufkit.py site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
